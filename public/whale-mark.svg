<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">WHALE Act emblem</title>
  <desc id="desc">A complete whale tail rising above curling ocean waves inside a circle.</desc>
  <defs>
    <clipPath id="emblem-window">
      <circle cx="256" cy="256" r="220"/>
    </clipPath>
  </defs>

  <circle cx="256" cy="256" r="229" fill="#ffffff" stroke="#000000" stroke-width="18"/>

  <g clip-path="url(#emblem-window)">
    <!-- One continuous silhouette keeps both flukes intact at every size. -->
    <path
      d="M256 430
         C247 344 228 280 193 253
         C155 224 121 208 106 176
         C98 158 99 134 105 114
         C134 141 160 133 192 146
         C225 158 247 184 256 219
         C267 182 291 158 328 145
         C364 133 390 142 407 124
         C410 151 400 176 380 198
         C361 224 327 234 299 253
         C269 280 257 344 256 430Z"
      fill="#000000"
    />

    <!-- The ocean is a separate, high-contrast shape with a visible crest. -->
    <path
      d="M-8 405
         C54 355 112 348 169 381
         C214 407 247 425 291 415
         C329 407 343 369 374 343
         C406 316 444 334 469 366
         C489 390 510 389 532 371
         L532 532H-8Z"
      fill="#000000"
    />

    <!-- White channels remain legible when the artwork is reduced to a favicon. -->
    <path
      d="M24 401
         C78 369 119 368 168 396
         C218 425 254 444 302 431
         C341 420 354 382 385 359
         C414 338 445 350 471 380"
      fill="none"
      stroke="#ffffff"
      stroke-width="17"
      stroke-linecap="round"
    />
    <path
      d="M55 439
         C104 414 145 418 190 444
         C235 470 276 481 317 460
         C350 444 368 420 392 411
         C417 402 443 410 463 428"
      fill="none"
      stroke="#ffffff"
      stroke-width="14"
      stroke-linecap="round"
    />
    <path
      d="M105 463
         C148 446 185 453 220 472
         C257 492 293 491 326 473
         C347 462 362 448 377 442"
      fill="none"
      stroke="#ffffff"
      stroke-width="10"
      stroke-linecap="round"
    />
  </g>
</svg>
